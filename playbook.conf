<Playbook>
	<Name>ReimaginedOS</Name>
	<Username>cr1mix</Username>
	<Git>https://github.com/cr1mix/ReimaginedOS</Git>
	<Title>ReimaginedOS Unstable 0.1V</Title>
	<ShortDescription>Windows, reimagined.</ShortDescription>
	<Description>UNSTABLE 0.1V test. AME playbook for a balanced, stable Windows with more performance, fewer services and less RAM. Hardware auto-tuning included. You pick every feature, service defaults are backed up first. Discord: https://discord.gg/NjkgT7vXBb</Description>
	<Details>Discord: https://discord.gg/NjkgT7vXBb - latest updates are verified there.</Details>
	<ProgressText>Playbook is being applied. Since this playbook targets a wide range of Windows versions, some errors may occur. Reboot after completion.</ProgressText>
	<Version>0.1.0</Version>
	<UpgradableFrom>any</UpgradableFrom>
	<Website>https://reimaginedos.pages.dev/</Website>
	<SupportedBuilds>
		<string>19041</string>
		<string>19042</string>
		<string>19043</string>
		<string>19044</string>
		<string>19045</string>
		<string>22000</string>
		<string>22621</string>
		<string>22631</string>
		<string>26100</string>
		<string>26200</string>
		<string>26300</string>
	</SupportedBuilds>
	<Overhaul>false</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="accept-risk" Description="BEFORE WE START. This playbook makes deep changes to Windows (services, registry, drivers, security mitigations, boot settings). Every change is a question you answer - nothing is applied without your say - but it MAY BREAK YOUR PC on unusual hardware or drivers. A full backup of every service start value is written to C:\ReimaginedOS-ServiceBackup before anything is touched, and Windows Restore is enabled. Do not run this playbook on your only PC without a full disk backup. You ACCEPT THE RISK that it may break your PC.">
			<Options>
				<RadioOption>
					<Text>I accept the risk - it may break my PC</Text>
					<Name>accept-risk</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="keep-defender" Description="What to do with Windows Defender. IMPORTANT: before applying, open Windows Security &gt; Virus &amp; threat protection &gt; Manage settings and turn OFF Tamper Protection, Real-time protection, Cloud-delivered protection and Automatic sample submission. NOTE: locked files and tamper-protected settings finish removing themselves at the NEXT REBOOT, before Defender can start - no guard tasks stay behind. Be careful: disabling/removing is destructive and NOT recommended for your first run.">
			<Options>
				<RadioOption>
					<Text>Keep Windows Defender (do not disable it) (Recommended)</Text>
					<Name>keep-defender</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Windows Defender (can be turned on back later)</Text>
					<Name>disable-defender</Name>
				</RadioOption>
				<RadioOption>
					<Text>DELETE Windows Defender permanently - IRREVERSIBLE (services, app and policies removed)</Text>
					<Name>delete-defender</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="keep-wu" Description="What to do with Windows Update (update service, installer tasks, driver updates, WaaSMedic and Update Health tools, update endpoints in the hosts file):">
			<Options>
				<RadioOption>
					<Text>Keep Windows Update with its driver updates (Recommended)</Text>
					<Name>keep-wu</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Windows Update and automatic driver updates</Text>
					<Name>disable-wu</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage Description="Apps - uncheck anything you want to keep. Checked = removed:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft Edge (browser, updater, tasks)</Text>
					<Name>remove-edge</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove OneDrive (app, sync service, folder)</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft Teams (new and personal)</Text>
					<Name>remove-teams</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove WSL (Windows Subsystem for Linux)</Text>
					<Name>remove-wsl</Name>
				</CheckboxOption>

			</Options>
		</CheckboxPage>
		<CheckboxPage Description="More apps - uncheck anything you want to keep. Checked = removed. The most common picks are pre-checked:">
			<Options>				<CheckboxOption IsChecked="false">
					<Text>Remove Calculator</Text>
					<Name>remove-calculator</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Notepad</Text>
					<Name>remove-notepad</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Paint (classic and new)</Text>
					<Name>remove-mspaint</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Windows Terminal</Text>
					<Name>remove-terminal</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Bloatware - uncheck anything you want to keep. Checked = removed:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove default bloatware (Bing, Solitaire, Spotify, Clipchamp, TikTok app, Facebook, Netflix and 80+ preinstalled apps) - uncheck to keep them</Text>
					<Name>remove-bloat</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Xbox Game Bar overlay (unpins it from Start too) - uncheck to keep it</Text>
					<Name>remove-gamebar</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove accessibility tools (Narrator, Magnifier, On-Screen Keyboard, Voice Access, Live Captions) - breaks accessibility features</Text>
					<Name>remove-accessibility</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable Automatic Maintenance and scheduled diagnostics (fewer idle wake-ups)</Text>
					<Name>disable-maintenance</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Windows 11 look - classic right-click menu is on by default, dark mode is on by default (Photo Viewer is restored if you remove the Photos app):">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Classic right-click context menu (Windows 10 style)</Text>
					<Name>legacy-context-menu</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Dark mode for apps and Windows</Text>
					<Name>dark-mode</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Taskbar aligned to the left (Windows 10 style)</Text>
					<Name>taskbar-left</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Small taskbar buttons (compact taskbar)</Text>
					<Name>small-taskbar</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Look extras - classic Start menu is on by default (pairs with removed search), transparency stays on unless you disable it:">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Disable transparency effects (faster desktop, less GPU load)</Text>
					<Name>disable-transparency</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Install Open-Shell classic Start menu (recommended with search removed)</Text>
					<Name>install-open-shell</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Extras - uncheck anything you want to keep. Checked = removed. Microsoft Store and useful apps stay by default. WiFi, Bluetooth, printing and audio are never touched unless you say so:">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Remove Microsoft Store (apps and licenses)</Text>
					<Name>remove-store</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove leftover stubs (handwriting pack, delivery leftovers, cached bloat entries)</Text>
					<Name>remove-apps</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove printing service (spooler) - uncheck if you print</Text>
					<Name>remove-printing</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Bluetooth stack - uncheck if you use Bluetooth devices</Text>
					<Name>remove-bt</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Photos and camera - uncheck anything you want to keep. Checked = removed:">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Remove Photos app</Text>
					<Name>remove-photos</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Camera app - check only if you never use the webcam</Text>
					<Name>remove-camera</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Snipping Tool (Snip and Sketch)</Text>
					<Name>remove-sketch</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Maps and clock - uncheck anything you want to keep. Checked = removed:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Maps</Text>
					<Name>remove-maps</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Alarms and Clock</Text>
					<Name>remove-alarms</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioPage DefaultOption="remove-xbox" Description="Remove Xbox console companion, Game Pass, Xbox overlay and the Xbox background services (auth, game save, networking, GameInput, GamingServices and the Xbox app packages). WiFi, Bluetooth, Defender and Update are not affected:">
			<Options>
				<RadioOption>
					<Text>Remove Xbox components (Console Companion, Game Pass, overlay, services)</Text>
					<Name>remove-xbox</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Xbox (Console Companion, Game Pass, overlay, services)</Text>
					<Name>keep-xbox</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="remove-ai" Description="Remove Windows AI features (Copilot, Recall, AI search, WindowsAI policies and AI-related app packages):">
			<Options>
				<RadioOption>
					<Text>Remove Windows AI / Copilot (Recommended)</Text>
					<Name>remove-ai</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Windows AI</Text>
					<Name>keep-ai</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="keep-ux" Description="UX and cosmetic extras (taskbar animations, widgets feed, GameDVR and Game Bar presence, hibernation):">
			<Options>
				<RadioOption>
					<Text>Disable animations, widgets, GameDVR, hibernation and UX extras</Text>
					<Name>ux-off</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep these features (default)</Text>
					<Name>keep-ux</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="block-telemetry" Description="Privacy and telemetry (hosts file blocks, error reporting, telemetry scheduled tasks, consent to data collection, advertising ID):">
			<Options>
				<RadioOption>
					<Text>Block telemetry and deny data collection (Recommended)</Text>
					<Name>block-telemetry</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep telemetry and data collection</Text>
					<Name>keep-telemetry</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="install-runtimes" Description="Install the full Visual C++ Redistributable pack (2005-2026, x86+x64) from the Executables folder:">
			<Options>
				<RadioOption>
					<Text>Install VC++ runtimes (Recommended)</Text>
					<Name>install-runtimes</Name>
				</RadioOption>
				<RadioOption>
					<Text>Skip runtimes installation</Text>
					<Name>skip-runtimes</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioImagePage DefaultOption="browser-brave" Description="Install a web browser now, downloaded live from the official vendor endpoint (internet connection required):">
			<Options>
				<RadioImageOption None="true"/>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#E5484D</GradientTopColor>
					<GradientBottomColor>#0d0d10</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF7139</GradientTopColor>
					<GradientBottomColor>#0d0d10</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#4285F4</GradientTopColor>
					<GradientBottomColor>#0d0d10</GradientBottomColor>
				</RadioImageOption>
			</Options>
		</RadioImagePage>
		<RadioPage DefaultOption="cpu-max" Description="Max CPU and memory for gaming (cr1mix power-plan, MMCSS priority, P/E-core scheduling). Laptop? Pick the lighter one below:">
			<Options>
				<RadioOption>
					<Text>Maximum CPU &amp; memory performance (Recommended)</Text>
					<Name>cpu-max</Name>
				</RadioOption>
				<RadioOption>
					<Text>Skip maximum tuning (lighter touch, best for laptops)</Text>
					<Name>cpu-balance</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="mitigations-standard" Description="Strip Spectre/VBS/HVCI mitigations for a few extra FPS. Needs reboot, some anticheats won't launch with these off:">
			<Options>
				<RadioOption>
					<Text>Keep security mitigations and virtualization (Recommended)</Text>
					<Name>mitigations-standard</Name>
				</RadioOption>
				<RadioOption>
					<Text>Remove security mitigations &amp; virtualization (extreme, at your own risk)</Text>
					<Name>mitigations-off</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="spectre-keep" Description="Spectre and Meltdown CPU mitigations (speculative-execution protections). Disabling them can gain a few percent in CPU-bound games, at the cost of security:">
			<Options>
				<RadioOption>
					<Text>Keep Spectre and Meltdown mitigations (Recommended)</Text>
					<Name>spectre-keep</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Spectre and Meltdown mitigations (more FPS, weaker security)</Text>
					<Name>disable-spectre</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="task-cleanup-standard" Description="Disable background scheduled tasks (maintenance, diagnostics, Maps, telemetry stuff). Update/Defender tasks follow their own pages:">
			<Options>
				<RadioOption>
					<Text>Disable extra scheduled tasks</Text>
					<Name>task-cleanup-full</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep scheduled tasks (default)</Text>
					<Name>task-cleanup-standard</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="svc-balanced" Description="Service preset. Xbox, BT, printing, WiFi, Store, Edge, OneDrive, Teams, Update, Defender always follow your other pages - presets never touch them:">
			<Options>
				<RadioOption>
					<Text>Light - minimal, telemetry and bloat only</Text>
					<Name>svc-light</Name>
				</RadioOption>
				<RadioOption>
					<Text>Balanced - safe debloat for daily use (Recommended)</Text>
					<Name>svc-balanced</Name>
				</RadioOption>
				<RadioOption>
					<Text>Extreme - disables many extras. May break file sharing, VPN, RDP, notifications, Phone Link, Hello, camera, Store licensing, some games and anticheats, SSTP VPN, Hyper-V crash dumps, encrypted USB drives</Text>
					<Name>svc-extreme</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="no-search" Description="Windows Search + Start indexing. Off by default - Start search dies, Open-Shell below replaces the menu:">
			<Options>
				<RadioOption>
					<Text>Keep Windows Search and Start indexing</Text>
					<Name>keep-search</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Windows Search (Recommended, Start search stops working)</Text>
					<Name>no-search</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="max-privacy" Description="Maximum privacy hardening (consent denies, ads and tracking, telemetry deep cuts):">
			<Options>
				<RadioOption>
					<Text>Maximum privacy hardening (Recommended)</Text>
					<Name>max-privacy</Name>
				</RadioOption>
				<RadioOption>
					<Text>Standard privacy</Text>
					<Name>privacy-standard</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="auto-tune-off" Description="THIS IS NOT A MATURE FEATURE - IF YOU RUN IT YOU MAY BE FUCKED. ONLY RUN IT IF YOU KNOW WHAT YOU ARE DOING, ELSE YOUR PC MAY BE FUCKED">
			<TopLine Text="reimaginedos hardware autotuning"/>
			<Options>
				<RadioOption>
					<Text>Auto-tune this hardware (physical PCs only)</Text>
					<Name>auto-tune-on</Name>
				</RadioOption>
				<RadioOption>
					<Text>Skip hardware auto-tuning (default)</Text>
					<Name>auto-tune-off</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="discord.gg/NjkgT7vXBb"/>
		</RadioPage>
		<RadioPage DefaultOption="msi-off" Description="MSI mode (Message Signaled Interrupts) on GPU, NVMe and network controllers for lower interrupt latency. Off by default. Virtual machines skip this automatically:">
			<Options>
				<RadioOption>
					<Text>Enable MSI mode on supported devices</Text>
					<Name>msi-on</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep default interrupt mode (Recommended)</Text>
					<Name>msi-off</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage Description="Slow extras - off by default, check only if you want them. NGEN recompiles every .NET assembly (up to 30 extra minutes of apply time, Windows does it alone in the background otherwise):">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Precompile .NET assemblies now with NGEN (slower apply, snappier .NET apps immediately)</Text>
					<Name>run-ngen</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>